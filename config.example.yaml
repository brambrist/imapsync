# Example imapsync config.
# Impersonation: SASL PLAIN with authzid (authcid = master_user, authzid = user_a/user_b).

server_a:
  type: imap              # imap (default) | maildir | ews
  host: mail-a.corp.ru
  port: 993
  master_user: svc_sync
  master_pass: "SECRET_A"

server_b:
  type: imap
  host: mail-b.corp.ru
  port: 993
  master_user: svc_sync
  master_pass: "SECRET_B"

# The type is set per side independently (mixed pairs work):
# server_a:
#   type: maildir
#   root: /var/vmail/%d/%n/Maildir   # %u - whole user_a/user_b, %n - before @, %d - domain
# server_b:
#   type: ews
#   ews_url: https://exch.corp.ru/EWS/Exchange.asmx   # or just host
#   master_user: svc_sync           # account with the ApplicationImpersonation role
#   master_pass: "SECRET"           # auth: Basic only (O365 needs OAuth2)

# direction: which way to copy missing messages. "both" (default), "a-to-b" or
# "b-to-a". A read-only endpoint (e.g. a PST archive) forces the direction away
# from it regardless. Typical for a one-way import.
direction: both

# Source of the folders/users lists: "yaml" (default) or "sqlite".
# With "sqlite" the folders/users sections below are optional and ignored;
# data is read from sqlite_path. Populate the DB with the imapsync db-* commands.
source: yaml
# sqlite_path: /var/lib/imapsync/imapsync.db

# Explicit folder pairs: name on A -> name on B.
folders:
  - a: "Sent"
    b: "Sent Items"

users:
  - name: ivanov
    user_a: ivanov@corp.ru
    user_b: ivanov@corp.ru
  - name: petrov
    user_a: petrov@corp.ru
    user_b: petrov@corp.ru
  - name: sidorov
    user_a: sidorov@corp.ru
    user_b: sidorov@corp.ru

workers: 2                 # FEWER than the number of users
sync_interval: 5m          # pause between full cycles
stats_interval: 1m         # summary stats period
per_user_timeout: 10m      # total time budget for one user
dial_timeout: 30s          # TCP connect timeout
io_timeout: 5m             # timeout for one IMAP operation (FETCH/APPEND/...)
fetch_batch_size: 200
insecure_tls: false
hash_header: "X-Imapsync-Hash"

# Connection retries on a drop / transient error.
# connect_retries: 0 means "default" (3); a negative value disables retries.
connect_retries: 3
retry_backoff: 5s          # base pause, grows exponentially

# Folder names in `folders` are matched to real ones: exact name -> SPECIAL-USE
# token ("\\Sent", "\\Drafts", ...) -> case-insensitive. You may write:
#   folders: [{a: "\\Sent", b: "\\Sent"}]

# Incremental reconciliation: the ID list comes from UID SEARCH, headers are
# fetched only for new messages, and parsing is cached in sqlite_path. Cuts the
# load dramatically on large folders. Requires sqlite_path (may be the same file
# as source: sqlite). When enabled, the DB also gets a user_status table -
# when and with what result each user's sync ran (shown by `imapsync db-list`).
# The daemon takes an exclusive lock on <sqlite_path>.lock - a second instance
# on the same DB will not start.
state_cache: false
# sqlite_path: /var/lib/imapsync/imapsync.db
full_resync_every: 24h     # how often to do a full folder rescan (catch cache drift)

# After this many consecutive failed runs a user's sync stops
# (lift it with `imapsync db-resume-user -name X` or db-forget-user). Requires a
# DB (state_cache or source: sqlite). A negative value disables it.
max_fail_streak: 10
