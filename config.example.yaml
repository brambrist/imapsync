# Пример конфига IMAP Sync.
# Имперсонация: SASL PLAIN с authzid (authcid = master_user, authzid = user_a/user_b).

server_a:
  type: imap              # imap (по умолчанию) | maildir
  host: mail-a.corp.ru
  port: 993
  master_user: svc_sync
  master_pass: "SECRET_A"

server_b:
  type: imap
  host: mail-b.corp.ru
  port: 993
  master_user: svc_sync
  master_pass: "SECRET_B"

# Тип задаётся на каждой стороне независимо (смешанные пары работают):
# server_a:
#   type: maildir
#   root: /var/vmail/%d/%n/Maildir   # %u - весь user_a/user_b, %n - до @, %d - домен
# server_b:
#   type: ews
#   ews_url: https://exch.corp.ru/EWS/Exchange.asmx   # или просто host
#   master_user: svc_sync           # учётка с ролью ApplicationImpersonation
#   master_pass: "SECRET"           # auth: только Basic (для O365 нужен OAuth2)

# Источник списков folders/users: "yaml" (по умолчанию) или "sqlite".
# При "sqlite" секции folders/users ниже необязательны и игнорируются,
# данные читаются из файла sqlite_path. Наполнять БД - командами imapsync db-*.
source: yaml
# sqlite_path: /var/lib/imapsync/imapsync.db

# Явные пары папок: имя на A -> имя на B.
folders:
  - a: "Sent"
    b: "Отправленные"

users:
  - name: ivanov
    user_a: ivanov@corp.ru
    user_b: ivanov@corp.ru
  - name: petrov
    user_a: petrov@corp.ru
    user_b: petrov@corp.ru
  - name: sidorov
    user_a: sidorov@corp.ru
    user_b: sidorov@corp.ru

workers: 2                 # МЕНЬШЕ числа юзеров
sync_interval: 5m          # пауза между полными циклами
stats_interval: 1m         # периодичность сводной статистики
per_user_timeout: 10m      # общий бюджет времени на одного юзера
dial_timeout: 30s          # таймаут установки TCP-соединения
io_timeout: 5m             # таймаут на одну IMAP-операцию (FETCH/APPEND/...)
fetch_batch_size: 200
insecure_tls: false
hash_header: "X-Imapsync-Hash"

# Повторы подключения при обрыве/транзиентной ошибке.
# connect_retries: 0 означает "дефолт" (3); для полного отключения не годится.
connect_retries: 3
retry_backoff: 5s          # базовая пауза, растёт экспоненциально

# Имена папок из folders сопоставляются с реальными: точное имя -> SPECIAL-USE
# токен ("\\Sent", "\\Drafts", ...) -> регистронезависимо. Можно писать:
#   folders: [{a: "\\Sent", b: "\\Sent"}]

# Инкрементальная сверка: список UID берётся через UID SEARCH, заголовки
# фетчатся только для новых писем, разбор кэшируется в sqlite_path. Резко
# снижает нагрузку на больших папках. Требует sqlite_path (можно тот же файл,
# что и для source: sqlite). При включении в БД также пишется таблица
# user_status - когда и с каким результатом отработал синк по каждому юзеру
# (виден через `imapsync db-list`). Демон берёт эксклюзивную блокировку на
# <sqlite_path>.lock - второй экземпляр на ту же БД не запустится.
state_cache: false
# sqlite_path: /var/lib/imapsync/imapsync.db
full_resync_every: 24h     # как часто делать полный пере-скан папки (отлов дрейфа кэша)

# После стольких прогонов подряд с ошибкой синк юзера останавливается
# (снять: `imapsync db-resume-user -name X` или db-forget-user). Требует БД
# (state_cache или source: sqlite). Отрицательное значение отключает.
max_fail_streak: 10
